<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Ingestion desk · Neta</title>
    <link rel="stylesheet" href="/admin/static/admin.css">
  </head>
  <body class="login-shell">
    <main class="login-panel">
      <div class="brand-mark" aria-hidden="true"><span>N</span><i></i></div>
      <p class="eyebrow">Private operations surface</p>
      <h1>Ingestion desk</h1>
      <p class="login-copy">
        Sign in to manage source cadence, execution requests, and safety controls.
        This local access mode is not available in production.
      </p>
      {% if error %}
      <p class="form-error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" action="/admin/login" class="login-form">
        <label for="token">Local access token</label>
        <input
          id="token"
          name="token"
          type="password"
          required
          autofocus
          autocomplete="current-password"
          spellcheck="false"
        >
        <button type="submit" class="button button-primary">Enter the desk</button>
      </form>
      <p class="login-footnote">Session cookies are signed, HTTP-only, and restricted to this admin path.</p>
    </main>
  </body>
</html>
