[project]
name = "neta-resume-infra"
version = "0.1.0"
description = "Production AWS infrastructure for Neta Resume"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pulumi==3.255.0",
    "pulumi-aws==7.40.0",
    "pulumi-awsx==3.8.0",
    "pulumi-eks==4.3.0",
    "pulumi-kubernetes==4.33.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
