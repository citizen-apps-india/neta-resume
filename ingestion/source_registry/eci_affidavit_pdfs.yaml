schema_version: 1
id: eci.affidavit_pdfs
source_code: eci
display_name: ECI affidavit PDFs
publisher: Election Commission of India
lifecycle: verification_only
authority:
  role: primary
  trust_tier: 1
  jurisdiction: India
rights:
  license: public-official
  commercial_use: review
  redistribution: review
  store_raw: true
  notes: Canonical legal evidence; access and processing must remain respectful and auditable.
ingestion:
  adapter: document
  base_url: https://affidavit.eci.gov.in/
  trigger:
    mode: manual
    profile: manual-authorised
  change_detection: [manual, content_hash]
  defaults:
    enabled: false
    paused: false
    frequency_seconds: null
    concurrency_limit: 1
    rate_limit_per_minute: 5
    retry_limit: 2
  guardrails:
    min_frequency_seconds: null
    max_frequency_seconds: null
    max_concurrency: 1
    max_rate_limit_per_minute: 10
    max_retry_limit: 3
  secret_refs: []
conversion:
  converter: neta_ingest.converters.eci:convert_affidavit
  contract: candidate_affidavit_evidence.v1
  produces: [affidavit_evidence_observation]
quality:
  freshness_slo_seconds: null
  minimum_records: 1
  required_fields: [document_hash, election_cycle, candidate_name]
verification:
  corroborate_with: [myneta.candidates]
  human_review_required: true
