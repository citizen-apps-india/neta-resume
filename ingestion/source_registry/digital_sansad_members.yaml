schema_version: 1
id: digital_sansad.members
source_code: sansad
display_name: Digital Sansad member directory
publisher: Parliament of India
lifecycle: active
authority:
  role: primary
  trust_tier: 1
  jurisdiction: India
rights:
  license: public-official
  commercial_use: review
  redistribution: review
  store_raw: true
  notes: Preserve the official member URL and identifiers with every observation.
ingestion:
  adapter: api
  base_url: https://sansad.in/
  trigger:
    mode: scheduled
    profile: parliament-session
  change_detection: [etag, last_modified, content_hash]
  defaults:
    enabled: true
    # Paused on registration (2026-09-15). `_initial_next_run` sets next_run_at to NOW, not
    # now+frequency, so registering unpaused would make this source due immediately and the
    # first tick would run it regardless of when the cron last did. Un-paused per source, in
    # the same change that removes its cron - see docs/OPERATIONS.md.
    paused: true
    frequency_seconds: 604800
    concurrency_limit: 2
    rate_limit_per_minute: 30
    retry_limit: 4
  guardrails:
    min_frequency_seconds: 300
    # Widened 2026-09-15 to match the actual GitHub Actions cadence (ingest.yml's
    # weekly roster cron, Mondays). The old 86400 ceiling encoded a freshness
    # target (roster could go stale after 1 day) this project has never met.
    max_frequency_seconds: 604800
    max_concurrency: 4
    max_rate_limit_per_minute: 60
    max_retry_limit: 6
  secret_refs: []
conversion:
  converter: neta_ingest.converters.sansad:convert_members
  contract: legislature_member.v1
  produces: [person_observation, office_term_observation, contact_observation]
quality:
  freshness_slo_seconds: 3600
  minimum_records: 500
  required_fields: [native_member_id, name, house]
orchestration:
  runner: neta_ingest.runners:run_digital_sansad_members
  raw_history: dlt
verification:
  corroborate_with: [prs.members, opensanctions.in_sansad]
  human_review_required: false
