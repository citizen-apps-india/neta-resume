schema_version: 1
id: news.google_feed
source_code: news
display_name: Google News discovery feed
publisher: Google News and originating publishers
# Retired 2026-09-24: the In The News tab was removed from the product and the collector deleted.
# Kept registered (disabled) so the admin console shows it as switched off rather than dropping it.
lifecycle: blocked
authority:
  role: reported
  trust_tier: 3
  jurisdiction: India
rights:
  license: reported
  commercial_use: review
  redistribution: prohibited
  store_raw: true
  notes: Store feed metadata and citations only; do not archive full article bodies without rights.
ingestion:
  adapter: feed
  base_url: https://news.google.com/
  trigger:
    mode: manual
    profile: retired
  change_detection: [event_id, content_hash]
  defaults:
    enabled: false
    paused: true
    frequency_seconds: null
    concurrency_limit: 1
    rate_limit_per_minute: 1
    retry_limit: 0
  guardrails:
    min_frequency_seconds: null
    max_frequency_seconds: null
    max_concurrency: 1
    max_rate_limit_per_minute: 1
    max_retry_limit: 0
  secret_refs: []
conversion:
  converter: neta_ingest.converters.news:convert_feed_item
  contract: reported_news_item.v1
  produces: [news_item_observation]
quality:
  freshness_slo_seconds: null
  minimum_records: 0
  required_fields: [canonical_url, headline, publisher, published_at]
verification:
  corroborate_with: []
  human_review_required: true
