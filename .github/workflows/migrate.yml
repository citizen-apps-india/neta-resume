name: migrate

# Schema + reference seeds reach Postgres HERE, not via a laptop full-replace. The frozen SQL baseline is
# tracked in schema_migrations; new SQLAlchemy-backed revisions are tracked by Alembic; seeds remain
# idempotent. Runs on relevant merges to main or manual dispatch.
#
# ONE-TIME ADOPTION on the already-populated Neon: dispatch this once after setting the secret, but first
# run `neta migrate --baseline` against it (the early ALTER migrations are not re-runnable). See OPERATIONS.

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/seeds/**"
      - "backend/database/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      NETA_MIGRATE_DATABASE_URL: ${{ secrets.NETA_MIGRATE_DATABASE_URL }}   # Neon owner DSN (DDL)
      NETA_BACKEND_DATABASE_URL: ${{ secrets.NETA_BACKEND_DATABASE_URL }}   # asyncpg owner DSN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.14.6
          version: 0.12.0
      - run: uv sync
      - name: Apply frozen legacy SQL migrations
        run: uv run neta migrate
      - name: Apply Alembic migrations
        run: uv run alembic -c backend/database/alembic.ini upgrade head
      - name: Apply reference seeds
        run: uv run neta seed
