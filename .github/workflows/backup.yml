name: backup

# A copy of the database outside Neon: pg_dump in custom format, encrypted, kept as a workflow artifact.
# The repository is public and anyone signed in to GitHub can download its artifacts, so the dump is
# encrypted with NETA_BACKUP_PASSPHRASE before upload and the job refuses to run without it.
#
# Restore: gpg --decrypt neta.dump.gpg > neta.dump && pg_restore --no-owner -d "$DSN" neta.dump
#
# Runs on the 2nd of each month and by hand. Each run wakes the database once, for a few minutes.

on:
  schedule:
    - cron: "37 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETA_MIGRATE_DATABASE_URL: ${{ secrets.NETA_MIGRATE_DATABASE_URL }}
      NETA_BACKUP_PASSPHRASE: ${{ secrets.NETA_BACKUP_PASSPHRASE }}
    steps:
      - name: Dump and encrypt
        run: |
          if [ -z "$NETA_MIGRATE_DATABASE_URL" ] || [ -z "$NETA_BACKUP_PASSPHRASE" ]; then
            echo "::error::NETA_MIGRATE_DATABASE_URL and NETA_BACKUP_PASSPHRASE must both be set"; exit 1
          fi
          set -o pipefail
          docker run --rm -e NETA_MIGRATE_DATABASE_URL postgres:18.4-bookworm \
            sh -c 'exec pg_dump --format=custom --no-owner --no-privileges "$NETA_MIGRATE_DATABASE_URL"' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 3<<<"$NETA_BACKUP_PASSPHRASE" -o neta.dump.gpg
          test -s neta.dump.gpg
          echo "Encrypted dump: $(du -h neta.dump.gpg | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neta-db-${{ github.run_id }}
          path: neta.dump.gpg
          retention-days: 90
          if-no-files-found: error
