name: news

# Weekly press-coverage refresh for sitting legislators (free Google News RSS).
# Idempotent: each person's news_item rows are replaced per run. DB via the NETA_DATABASE_URL secret.
#
# The pipeline bounds itself to a ~3h30m wall-clock budget and always processes the least-recently
# covered legislators first (see ingestion/neta_ingest/pipelines/enrich/news.py), so a run that runs out
# of budget stops cleanly and next week's run picks up the tail. timeout-minutes below is a hard backstop
# comfortably under GitHub's own 360-minute ceiling, in case that self-bound ever fails to trip.

on:
  workflow_dispatch:
    inputs:
      house:
        description: "ls | rs (blank = both)"
        required: false
        default: ""
      limit:
        description: "cap legislators (testing; blank = all)"
        required: false
        default: ""
  schedule:
    # Monday 03:00 UTC, after the roster refresh.
    - cron: "0 3 * * 1"

concurrency:
  # Shares the `ingest` group so the news crawl can never run alongside another pipeline that
  # touches the same rows. news.yml had no group at all, which meant it could overlap ingest.yml
  # as well as the scheduler.
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: ingestion
    env:
      NETA_DATABASE_URL: ${{ secrets.NETA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.14.6
          version: 0.12.0
      - run: uv sync
      - name: Scrape news
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.house }}" ] && ARGS="$ARGS --house ${{ github.event.inputs.house }}"
          [ -n "${{ github.event.inputs.limit }}" ] && ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          uv run neta news $ARGS
