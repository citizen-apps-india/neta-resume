name: ingest

# Independent, idempotent ingestion against the hosted Postgres (NETA_DATABASE_URL = ingest write-role).
# Pipelines upsert on natural keys, so re-runs never duplicate. This is the path that replaces the old
# laptop "run locally → load_remote_db.sh full-replace": any pipeline now runs here, directly on Neon.
#
# MANUAL ONLY as of 2026-09-16. Every schedule this file used to carry (weekly roster, monthly
# attendance, monthly macro-indicators) has migrated to the control plane: the sources are defined in
# ingestion/source_registry/, their cadence lives in Postgres, and dispatch.yml runs them. This
# workflow remains for ad-hoc backfills and one-off commands, which is what `args` is for.

on:
  workflow_dispatch:
    inputs:
      args:
        description: >-
          Full `neta` command, e.g. "attendance --house rs", "leadership",
          "historical-lookup DL_MCD2012 --house dl_mcd --current-cycle DL_MCD2022",
          "myneta --cycle LS2024 --limit 600"
        required: true
        default: ls-roster

concurrency:
  group: ingest          # never let two ingest runs write Neon at once
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NETA_DATABASE_URL: ${{ secrets.NETA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.14.6
          version: 0.12.0
      - run: uv sync
      - name: Run pipeline
        env:
          ARGS: ${{ inputs.args }}   # via env (not inline ${{ }}): no script injection; $ARGS only word-splits
        run: uv run neta $ARGS
