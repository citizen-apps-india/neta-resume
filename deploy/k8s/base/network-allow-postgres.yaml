apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # Fail closed until the platform overlay supplies the database/VPC CIDR.
            cidr: 192.0.2.0/24
        - ipBlock:
            cidr: 2001:db8::/32
      ports:
        - protocol: TCP
          port: 5432
