apiVersion: apps/v1
kind: Deployment
metadata:
  name: neta-control
  labels:
    app.kubernetes.io/name: neta-control
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neta-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neta-control
        app.kubernetes.io/component: control-plane
    spec:
      nodeSelector:
        neta.dev/workload-tier: application
      serviceAccountName: neta-control
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: ghcr.io/citizen-apps-india/neta-resume-control:SET_BY_IMAGE_PROMOTION
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neta-control-config
          env:
            - name: NETA_BACKEND_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neta-runtime
                  key: NETA_BACKEND_DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
