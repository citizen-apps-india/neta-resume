apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neta-runtime
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: neta-runtime-store
  target:
    name: neta-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NETA_DATABASE_URL
      remoteRef:
        key: neta/production/runtime
        property: NETA_DATABASE_URL
    - secretKey: NETA_BACKEND_DATABASE_URL
      remoteRef:
        key: neta/production/runtime
        property: NETA_BACKEND_DATABASE_URL
    - secretKey: NETA_MIGRATE_DATABASE_URL
      remoteRef:
        key: neta/production/runtime
        property: NETA_MIGRATE_DATABASE_URL
