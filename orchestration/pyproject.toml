[project]
name = "neta-orchestration"
version = "0.1.0"
description = "Dagster execution plane and dlt raw-envelope history for Neta-Resume."
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dlt[postgres]>=1.29,<2",
    "neta-backend",
    "neta-core",
    "neta-ingest",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[tool.uv.sources]
neta-backend = { workspace = true }
neta-core = { workspace = true }
neta-ingest = { workspace = true }

[project.scripts]
neta-orchestrator = "neta_orchestration.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.dagster]
module_name = "neta_orchestration.definitions"
registry_modules = ["neta_orchestration.component"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neta_orchestration"]
